<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Audio Transcriber</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="titlebar">
      <div class="titlebar__brand">
        <svg class="titlebar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <line x1="12" y1="18" x2="12" y2="22" />
        </svg>
        <h1 class="titlebar__title">Audio Transcriber</h1>
      </div>

      <!-- Centred on the window, not on the space left over beside the brand,
           so it stays put as the title changes. -->
      <nav class="tabs" role="tablist" aria-label="View">
        <button
          id="tabTranscribe"
          class="tabs__tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panelTranscribe"
        >
          Transcribe
        </button>
        <button
          id="tabSettings"
          class="tabs__tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panelSettings"
        >
          Settings
        </button>
      </nav>
    </header>

    <main class="stage">
      <section id="panelTranscribe" class="column" role="tabpanel" aria-labelledby="tabTranscribe">
        <button id="dropzone" class="dropzone" type="button">
          <svg class="dropzone__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12" />
            <path d="M7 10l5 5 5-5" />
            <path d="M4 20h16" />
          </svg>
          <span class="dropzone__title">Drop audio here</span>
          <span class="dropzone__hint">or click to choose a file</span>
        </button>

        <section id="file" class="file" hidden>
          <h2 id="fileName" class="file__name"></h2>
          <p id="fileMeta" class="file__meta"></p>
          <p id="filePath" class="file__path"></p>
          <button id="start" class="button" type="button">Transcribe</button>
        </section>

        <p id="status" class="status" hidden></p>
        <p id="log" class="log" hidden></p>

        <section id="result" class="result" hidden>
          <div class="result__head">
            <h2 class="result__title">Transcript</h2>
            <span id="resultMeta" class="result__meta"></span>
          </div>
          <ol id="segments" class="segments"></ol>
        </section>
      </section>

      <section id="panelSettings" class="column" role="tabpanel" aria-labelledby="tabSettings" hidden>
        <section class="card">
          <h2 class="card__title">HuggingFace token</h2>
          <p class="card__hint">
            Speaker separation needs one. It stays on this machine — never uploaded, never logged.
          </p>
          <div class="token__row">
            <input
              id="token"
              class="token__input"
              type="password"
              placeholder="hf_…"
              spellcheck="false"
            />
            <button id="saveToken" class="button button--quiet" type="button">Save</button>
          </div>
          <p id="tokenState" class="card__state"></p>
          <p id="tokenPath" class="card__path"></p>
        </section>

        <section class="card">
          <h2 class="card__title">Transcription</h2>
          <p class="card__hint">
            Fixed at Chinese · large-v3 · 2 speakers for now. M3 turns these into controls.
          </p>
        </section>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
