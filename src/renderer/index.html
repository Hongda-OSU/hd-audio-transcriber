<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>音频转录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="titlebar">
      <svg class="titlebar__icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="9" y="2" width="6" height="11" rx="3" />
        <path d="M5 11a7 7 0 0 0 14 0" />
        <line x1="12" y1="18" x2="12" y2="22" />
      </svg>
      <h1 class="titlebar__title">音频转录</h1>
    </header>

    <main class="stage">
      <button id="dropzone" class="dropzone" type="button">
        <svg class="dropzone__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="M7 10l5 5 5-5" />
          <path d="M4 20h16" />
        </svg>
        <span class="dropzone__title">把音频拖到这里</span>
        <span class="dropzone__hint">或点击选择文件</span>
      </button>

      <p id="status" class="status" hidden></p>

      <section id="file" class="file" hidden>
        <h2 id="fileName" class="file__name"></h2>
        <p id="fileMeta" class="file__meta"></p>
        <p id="filePath" class="file__path"></p>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
